plugins {
    id 'com.android.application' version '8.12.1'
}

android {
    namespace = 'com.healthscan.app'
    compileSdk = 34

    defaultConfig {
        applicationId = 'com.healthscan.app'
        minSdk = 24
        targetSdk = 34
        versionCode = 1
        versionName = '0.1.0'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    buildTypes {
        release {
            minifyEnabled = false
        }
    }
}

dependencies {
